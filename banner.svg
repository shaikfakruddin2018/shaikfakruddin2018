<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1c2230" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.4"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- accent bar -->
  <rect x="80" y="118" width="56" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- name -->
  <text x="80" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="0.5">Shaik Fakruddin</text>

  <!-- title -->
  <text x="82" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#8b949e" letter-spacing="3">DATA &amp; ANALYTICS ENGINEER</text>

  <!-- tagline -->
  <text x="82" y="252" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#566072">Building data systems that scale — pipelines, models, and semantic layers teams trust.</text>

  <!-- stack chips -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9aa4b2">
    <rect x="82"  y="276" width="92"  height="26" rx="13" fill="#161b22" stroke="#262d38" stroke-width="1"/>
    <text x="128" y="293" text-anchor="middle">Snowflake</text>
    <rect x="184" y="276" width="54"  height="26" rx="13" fill="#161b22" stroke="#262d38" stroke-width="1"/>
    <text x="211" y="293" text-anchor="middle">dbt</text>
    <rect x="248" y="276" width="72"  height="26" rx="13" fill="#161b22" stroke="#262d38" stroke-width="1"/>
    <text x="284" y="293" text-anchor="middle">Python</text>
    <rect x="330" y="276" width="54"  height="26" rx="13" fill="#161b22" stroke="#262d38" stroke-width="1"/>
    <text x="357" y="293" text-anchor="middle">SQL</text>
    <rect x="394" y="276" width="84"  height="26" rx="13" fill="#161b22" stroke="#262d38" stroke-width="1"/>
    <text x="436" y="293" text-anchor="middle">Power BI</text>
  </g>

  <!-- decorative right-side node graph -->
  <g opacity="0.9">
    <g stroke="#243044" stroke-width="1.5" fill="none">
      <line x1="980" y1="90"  x2="1060" y2="140"/>
      <line x1="1060" y1="140" x2="1010" y2="220"/>
      <line x1="1060" y1="140" x2="1140" y2="180"/>
      <line x1="980" y1="90"  x2="1080" y2="60"/>
      <line x1="1010" y1="220" x2="1110" y2="250"/>
    </g>
    <g fill="#38bdf8">
      <circle cx="980" cy="90" r="6"/>
      <circle cx="1140" cy="180" r="5"/>
      <circle cx="1110" cy="250" r="5"/>
    </g>
    <g fill="#818cf8">
      <circle cx="1060" cy="140" r="7"/>
      <circle cx="1080" cy="60" r="4"/>
    </g>
    <g fill="#22d3ee">
      <circle cx="1010" cy="220" r="5"/>
    </g>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="317" width="1200" height="3" fill="url(#accent)"/>
</svg>
